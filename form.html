<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engaged Learning Student Feedback</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>Engaged Learning Student Feedback Form</h1>

        <p class="intro">
            Share your engaged learning experience to help
            improve resources and support for UMSI students.
        </p>

        <!-- Replace YOUR_FORM_ID with the ID from your Formspree form -->
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="post">

            <p class="required-note">
                Fields marked with <span class="required" aria-hidden="true">*</span> are required.
            </p>

            <fieldset>
                <legend>Student Information</legend>

                <label for="first-name">First Name: <span class="required" aria-hidden="true">*</span></label>
                <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>

                <label for="last-name">Last Name: <span class="required" aria-hidden="true">*</span></label>
                <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>

                <label for="email">Email Address: <span class="required" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="program">Academic Program: <span class="required" aria-hidden="true">*</span></label>
                <select id="program" name="program" required>
                    <option value="" disabled selected>-- Select your program --</option>
                    <option value="bsi">BSI</option>
                    <option value="msi">MSI</option>
                    <option value="mhi">MHI</option>
                    <option value="phd">PhD</option>
                    <option value="other">Other</option>
                </select>
            </fieldset>

            <fieldset class="radio-group">
                <legend>Current or Most Recent Project Stage: <span class="required" aria-hidden="true">*</span></legend>

                <div class="radio-option">
                    <input type="radio" id="preparing" name="stage" value="preparing" required>
                    <label for="preparing">Preparing for the Experience</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="starting" name="stage" value="starting">
                    <label for="starting">Starting the Experience</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="during" name="stage" value="during">
                    <label for="during">During the Experience</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="ending" name="stage" value="ending">
                    <label for="ending">Ending the Experience</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="after" name="stage" value="after">
                    <label for="after">After the Experience</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Your Feedback</legend>

                <label for="start-date">Project Start Date (optional):</label>
                <input type="date" id="start-date" name="start-date">

                <label for="feedback">Your Feedback: <span class="required" aria-hidden="true">*</span></label>
                <textarea id="feedback" name="feedback" rows="5" required></textarea>
            </fieldset>

            <input type="submit" value="Submit Feedback">
        </form>
    </main>
</body>

</html>
